<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF3366" />
    
    <!-- Primary Meta Tags -->
    <title>Spree - The best deals, in one feed | Personalized Shopping Deals</title>
    <meta name="title" content="Spree - The best deals, in one feed | Personalized Shopping Deals" />
    <meta
      name="description"
      content="Spree brings you the best deals from stores across the internet in one personalized feed. Save what you like, buy in seconds. Compare prices, read real reviews, and discover deals tailored to your interests."
    />
    <meta name="keywords" content="shopping deals, personalized deals, online shopping, price comparison, deal feed, shopping app, best deals, discount shopping, Spree app" />
    <meta name="author" content="Spree" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spree.ai/" />
    <meta property="og:title" content="Spree - The best deals, in one feed" />
    <meta property="og:description" content="Scroll a personalized deal feed from stores across the internet. Save what you like, buy in seconds." />
    <meta property="og:image" content="https://spree.ai/og-image.png" />
    <meta property="og:site_name" content="Spree" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://spree.ai/" />
    <meta name="twitter:title" content="Spree - The best deals, in one feed" />
    <meta name="twitter:description" content="Scroll a personalized deal feed from stores across the internet. Save what you like, buy in seconds." />
    <meta name="twitter:image" content="https://spree.ai/og-image.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://spree.ai/" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Spree",
      "applicationCategory": "ShoppingApplication",
      "operatingSystem": "iOS",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Spree brings you the best deals from stores across the internet in one personalized feed. Save what you like, buy in seconds.",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.5"
      },
      "featureList": [
        "Personalized deal feed",
        "Price comparison across stores",
        "Real customer reviews",
        "Instant checkout",
        "Save products for later"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Spree",
      "url": "https://spree.ai",
      "logo": "https://spree.ai/spree-logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "team@getspree.app",
        "contactType": "Customer Service"
      },
      "sameAs": [
        "https://www.linkedin.com/company/spree"
      ]
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
