version: '3.8'
services:
  spree-web:
    container_name: spree-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://4.242.5.141:8004/api
    ports:
      - "3000:443"
    environment:
      - NODE_ENV=production
      - HTTPS=true
      - GENERATE_SOURCEMAP=false
    restart: unless-stopped
