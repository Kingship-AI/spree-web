version: '3.8'
services:
  spree-web:
    container_name: spree-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://host.docker.internal:8004/api
    ports:
      - "3000:443"
    environment:
      - NODE_ENV=production
      - HTTPS=true
      - GENERATE_SOURCEMAP=false
    restart: unless-stopped
    # Add extra_hosts to enable host.docker.internal on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
